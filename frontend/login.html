<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DineQR — Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; background:#f8f9fa; }
    .login-box { max-width:400px; margin:80px auto; padding:30px; background:white; border-radius:10px; box-shadow:0 0 15px rgba(0,0,0,0.1); }
    .btn-primary { width:100%; }
    footer { padding: 20px 0; text-align:center; color:#6c757d; margin-top:50px; }
  </style>
</head>
<body>

  <div class="login-box">
    <h3 class="text-center mb-3">Register / Login</h3>
    <form>
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" placeholder="Enter your name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" placeholder="Enter email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-primary">Register</button>
    </form>
  </div>

  <footer>
    &copy; 2025 DineQR. All Rights Reserved.
  </footer>

</body>
</html>
