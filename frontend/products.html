<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DineQR — Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; background:#f8f9fa; }
    .product-card { box-shadow:0 0 8px rgba(0,0,0,0.1); border-radius:10px; overflow:hidden; margin-bottom:20px; }
    .product-card img { width:100%; height:200px; object-fit:cover; }
    .btn-primary { width:100%; }
    footer { padding: 20px 0; text-align:center; color:#6c757d; margin-top:50px; }
  </style>
</head>
<body>

  <div class="container py-5">
    <h2 class="mb-4 text-center">Menu Items</h2>
    <div class="row">
      <div class="col-md-4">
        <div class="product-card">
          <img src="https://joyfoodsunshine.com/wp-content/uploads/2021/02/best-homemade-tomato-soup-recipe-4.jpg" alt="Tomato Soup">
          <div class="p-3">
            <h5>Tomato Soup</h5>
            <p class="text-muted">Creamy tomato soup with fresh basil.</p>
            <div class="d-flex justify-content-between align-items-center">
              <span class="fw-bold">£3.50</span>
              <a href="details.html" class="btn btn-primary btn-sm">Details</a>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="product-card">
          <img src="https://www.onceuponachef.com/images/2020/05/best-grilled-chicken-1200x1658.jpg" alt="Grilled Chicken">
          <div class="p-3">
            <h5>Grilled Chicken</h5>
            <p class="text-muted">Served with seasoned potatoes.</p>
            <div class="d-flex justify-content-between align-items-center">
              <span class="fw-bold">£8.75</span>
              <a href="details.html" class="btn btn-primary btn-sm">Details</a>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="product-card">
          <img src="https://sallysbakingaddiction.com/wp-content/uploads/2013/04/triple-chocolate-cake-4.jpg" alt="Chocolate Cake">
          <div class="p-3">
            <h5>Chocolate Cake</h5>
            <p class="text-muted">Rich dark chocolate slice.</p>
            <div class="d-flex justify-content-between align-items-center">
              <span class="fw-bold">£3.00</span>
              <a href="details.html" class="btn btn-primary btn-sm">Details</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2025 DineQR. All Rights Reserved.
  </footer>

</body>
</html>
